name: Reconstruire la liste
on:
  push:
    paths:
      - 'jardin/mots.txt'
      - '.outils/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: liste
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer les pages de la liste
        run: python .outils/build_jardin.py jardin
      - name: Publier les pages générées
        run: |
          git config user.name "liste-bot"
          git config user.email "liste-bot@users.noreply.github.com"
          git add -A jardin
          if git diff --cached --quiet; then echo "Rien à publier"; else git commit -m "Liste : pages régénérées" && git push; fi
